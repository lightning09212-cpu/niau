<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>美容師求人リールメーカー</title>
    <style>
:root {
  --bg: #f7f7f4;
  --surface: #ffffff;
  --surface-soft: #f1f5f3;
  --text: #1f2421;
  --muted: #68716c;
  --line: #dfe5e1;
  --accent: #1f7a5a;
  --accent-dark: #14543f;
  --accent-soft: #e5f4ed;
  --warning: #9a5b24;
  --shadow: 0 18px 45px rgba(31, 36, 33, 0.08);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
.app-shell {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: max(24px, env(safe-area-inset-top)) 14px max(40px, env(safe-area-inset-bottom)) 14px;
}
.app-header {
  margin-bottom: 18px;
}
.eyebrow {
  margin: 0 0 6px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1 {
  margin-bottom: 8px;
  font-size: clamp(1.9rem, 5vw, 3rem);
  line-height: 1.15;
}
.lead {
  max-width: 760px;
  margin-bottom: 0;
  color: var(--muted);
  font-size: 0.98rem;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
